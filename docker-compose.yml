services:
  control:
    build: ./control
    ports:
      - "8000:8000"
    volumes:
      - control-data:/data
      - ./web:/web:ro
    environment:
      CONTROL_DB: /data/control.db
      PRINTER_URL: http://printer:8001
      WEB_DIR: /web
      LEASE_TTL: "30"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/batches')"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      printer:
        condition: service_started

  worker-a:
    build: ./worker
    volumes:
      - worker-a-data:/data
    environment:
      CONTROL_URL: http://control:8000
      PRINTER_URL: http://printer:8001
      WORKER_ID: worker-A
      WORKER_DB: /data/worker.db
      PRINT_TIMEOUT: "12"
    restart: unless-stopped
    depends_on:
      - control
      - printer

  worker-b:
    build: ./worker
    volumes:
      - worker-b-data:/data
    environment:
      CONTROL_URL: http://control:8000
      PRINTER_URL: http://printer:8001
      WORKER_ID: worker-B
      WORKER_DB: /data/worker.db
      PRINT_TIMEOUT: "12"
    restart: unless-stopped
    depends_on:
      - control
      - printer

  printer:
    build: ./printer
    ports:
      - "8001:8001"
    volumes:
      - printer-data:/data
    environment:
      PRINTER_DB: /data/printer.db
    restart: unless-stopped

volumes:
  control-data:
  worker-a-data:
  worker-b-data:
  printer-data:
